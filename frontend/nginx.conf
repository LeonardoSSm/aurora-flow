server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Compressão
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Cache de assets com hash no nome (gerados pelo Vite)
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html aponta para os assets com hash do build atual: sem isto o navegador guardava a
    # página antiga por heurística (sem Cache-Control) e, depois de um deploy, seguia abrindo a
    # versão anterior. "no-cache" = sempre revalida (ETag → 304 barato quando nada mudou).
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA fallback: qualquer rota serve o index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
