name: CI

on:
  push:
    branches: [main, 'cycle/**']
  pull_request:
    branches: [main]

jobs:
  secrets:
    name: Secret scan (heuristic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject tracked env files and private keys
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.local$|\.pem$|id_rsa'; then
            echo "Tracked secret-like files found"
            exit 1
          fi
          if git grep -nE 'BEGIN (RSA |OPENSSH )?PRIVATE KEY' -- ':!.github/**' ':!**/node_modules/**'; then
            echo "Private key material found"
            exit 1
          fi

  backend:
    name: Backend — lint, build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Audit backend dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: backend
        continue-on-error: true

      - name: Lint backend
        run: npm run lint
        working-directory: backend

      - name: Build backend
        run: npm run build
        working-directory: backend

      - name: Test backend
        run: npm test -- --maxWorkers=2 --forceExit
        working-directory: backend

  frontend:
    name: Frontend — lint, build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Test frontend
        run: npm test
        working-directory: frontend

  integration:
    name: Integration — API + Postgres + RabbitMQ
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aurora_flow
          POSTGRES_PASSWORD: aurora_flow
          POSTGRES_DB: aurora_flow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aurora_flow -d aurora_flow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: aurora_flow
          RABBITMQ_DEFAULT_PASS: aurora_flow
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Run integration suite
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: aurora_flow
          DB_PASSWORD: aurora_flow
          DB_NAME: aurora_flow_test
          RABBITMQ_ENABLED: 'true'
          RABBITMQ_URL: amqp://aurora_flow:aurora_flow@localhost:5672
          HTTP_ALLOW_PRIVATE_URLS: 'true'
        run: npm run test:integration
