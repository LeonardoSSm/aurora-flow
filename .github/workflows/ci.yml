name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — lint, build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Lint backend
        run: npx eslint backend/src --config eslint.config.cjs

      - name: Build backend
        run: npm run build
        working-directory: backend

      - name: Test backend with coverage
        run: npm test -- --coverage --forceExit
        working-directory: backend

  frontend:
    name: Frontend — lint, build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

      # tsc -b (type-check) roda como parte do build, antes do vite build.
      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Test frontend
        run: npm test
        working-directory: frontend

  integration:
    name: Integration — API real contra Postgres
    runs-on: ubuntu-latest

    # Banco de teste descartável, só desta execução — nunca o de desenvolvimento.
    # Credenciais e nome do banco batem com os defaults de test/integration/setup-env.ts,
    # então nenhuma delas precisa ser repetida como env aqui.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: formhub
          POSTGRES_PASSWORD: formhub
          POSTGRES_DB: formhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U formhub -d formhub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Run integration suite
        run: npm run test:integration
        working-directory: backend
