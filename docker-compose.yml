services:
  # ── Infraestrutura (profile: app) ────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: formhub-postgres
    restart: unless-stopped
    profiles: [app]
    environment:
      POSTGRES_DB: formhub
      POSTGRES_USER: formhub
      POSTGRES_PASSWORD: ${DB_PASSWORD:-formhub}
    ports:
      - "5432:5432"
    volumes:
      - formhub_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formhub -d formhub"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - formhub-network
    deploy:
      resources:
        limits:
          memory: 384m

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: formhub-rabbitmq
    restart: unless-stopped
    profiles: [app]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-formhub}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-formhub}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - formhub_rabbitmq_data:/var/lib/rabbitmq
      - ./observability/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - formhub-network
    deploy:
      resources:
        limits:
          memory: 192m

  evolution-api:
    image: atendai/evolution-api:latest
    container_name: formhub-evolution
    restart: unless-stopped
    profiles: [app]
    ports:
      - "8082:8080"
    environment:
      SERVER_URL: ${WHATSAPP_EVOLUTION_PUBLIC_URL:-http://localhost:8082}
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${WHATSAPP_EVOLUTION_API_KEY:-formhub-evolution-key-2026}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: "postgresql://formhub:${DB_PASSWORD:-formhub}@postgres:5432/evolution?schema=public"
      DATABASE_CONNECTION_CLIENT_NAME: evolution_formhub
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_LABELS: "true"
      DATABASE_SAVE_DATA_HISTORIC: "true"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "false"
      RABBITMQ_ENABLED: "false"
      LOG_LEVEL: ERROR
      LOG_COLOR: "false"
      LOG_BAILEYS: error
      DEL_INSTANCE: "false"
      QRCODE_LIMIT: "30"
      CONFIG_SESSION_PHONE_VERSION: "2.3000.1035194821"
      WEBHOOK_GLOBAL_ENABLED: "false"
    volumes:
      - evolution_data:/evolution/instances
    networks:
      - formhub-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 384m

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: formhub-backend
    restart: unless-stopped
    profiles: [app]
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_PASSWORD: ${DB_PASSWORD:-formhub}
      DB_AUTO_MIGRATE: "false"
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-formhub}:${RABBITMQ_PASS:-formhub}@rabbitmq:5672
      WHATSAPP_EVOLUTION_BASE_URL: http://evolution-api:8080
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "3000:3000"
    volumes:
      # Sem isso, todo anexo enviado (fotos de etiqueta, etc.) vive só na camada
      # gravável descartável do container — some no próximo rebuild/recreate,
      # mesmo a linha no Postgres (que tem volume próprio) continuando existir.
      - formhub_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - formhub-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 384m

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api/v1}
        VITE_APP_URL: ${VITE_APP_URL:-http://localhost:5173}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
        VITE_GRAFANA_URL: ${VITE_GRAFANA_URL:-http://localhost:3001}
        VITE_PROMETHEUS_URL: ${VITE_PROMETHEUS_URL:-http://localhost:9090}
        VITE_RABBITMQ_MANAGEMENT_URL: ${VITE_RABBITMQ_MANAGEMENT_URL:-http://localhost:15672}
    container_name: formhub-frontend
    restart: unless-stopped
    profiles: [app]
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - formhub-network
    deploy:
      resources:
        limits:
          memory: 64m

  # API de consultas ao banco do ERP (MySQL) para os campos "Lista do ERP".
  # Sem "ports": só quem está na formhub-network (o backend) chega nela, por
  # http://erp-lookup:3100. Valores vêm das variáveis ERP_LOOKUP_* do .env da raiz;
  # sem elas a API sobe "não configurada" (503 nas consultas) e não derruba nada.
  erp-lookup:
    build:
      context: ./erp-lookup
      dockerfile: Dockerfile
    container_name: tijucaflow-erp-lookup
    restart: unless-stopped
    profiles: [app]
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3100
      LOOKUP_API_TOKEN: ${ERP_LOOKUP_API_TOKEN:-}
      ERP_DB_HOST: ${ERP_LOOKUP_DB_HOST:-}
      ERP_DB_PORT: ${ERP_LOOKUP_DB_PORT:-3306}
      ERP_DB_NAME: ${ERP_LOOKUP_DB_NAME:-tijuca_lookup}
      ERP_DB_USER: ${ERP_LOOKUP_DB_USER:-tijuca_lookup}
      ERP_DB_PASSWORD: ${ERP_LOOKUP_DB_PASSWORD:-}
      ERP_DB_CONNECTION_LIMIT: ${ERP_LOOKUP_DB_CONNECTION_LIMIT:-10}
      ERP_DB_QUERY_TIMEOUT_MS: ${ERP_LOOKUP_DB_QUERY_TIMEOUT_MS:-5000}
      FONTE_EXEMPLO_HABILITADA: ${ERP_LOOKUP_FONTE_EXEMPLO:-false}
    expose:
      - "3100"
    networks:
      - formhub-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 128m

  # ── Desenvolvimento do erp-lookup (profile: erp-dev) ──────────────────────────
  # MySQL falso para testar o erp-lookup sem tocar no ERP real. Na primeira subida
  # roda erp-lookup/dev/seed.sql. Para apontar o erp-lookup para ele:
  # ERP_LOOKUP_DB_HOST=erp-mysql-dev ERP_LOOKUP_DB_PASSWORD=tijuca-lookup-dev
  erp-mysql-dev:
    image: mysql:8.4
    container_name: tijucaflow-erp-mysql-dev
    restart: unless-stopped
    profiles: [erp-dev]
    environment:
      MYSQL_ROOT_PASSWORD: ${ERP_DEV_ROOT_PASSWORD:-tijuca-dev}
    ports:
      - "3307:3306"
    volumes:
      - ./erp-lookup/dev:/docker-entrypoint-initdb.d:ro
    networks:
      - formhub-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          # Ocioso já passa de 430 MB; 512 MB deixava pouca folga.
          memory: 768m

  # ── Observabilidade (profile: observability) ──────────────────────────────────

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: formhub-postgres-exporter
    restart: unless-stopped
    profiles: [observability]
    environment:
      DATA_SOURCE_NAME: postgresql://formhub:${DB_PASSWORD:-formhub}@postgres:5432/formhub?sslmode=disable
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - formhub-network
    deploy:
      resources:
        limits:
          memory: 64m

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: formhub-prometheus
    restart: unless-stopped
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/metrics_token:/etc/prometheus/metrics_token:ro
      - formhub_prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres-exporter:
        condition: service_started
    networks:
      - formhub-network
    deploy:
      resources:
        limits:
          memory: 256m

  grafana:
    image: grafana/grafana:11.4.0
    container_name: formhub-grafana
    restart: unless-stopped
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-formhub}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - formhub_grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - formhub-network
    deploy:
      resources:
        limits:
          memory: 192m

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: formhub-pgadmin
    restart: unless-stopped
    profiles: [tools]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@tijucaalimentos.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-formhub}
    ports:
      - "5050:80"
    volumes:
      - formhub_pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - formhub-network
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  formhub_pg_data:
  formhub_rabbitmq_data:
  formhub_prometheus_data:
  formhub_grafana_data:
  formhub_pgadmin_data:
  formhub_uploads:
  evolution_data:

networks:
  formhub-network:
    driver: bridge
